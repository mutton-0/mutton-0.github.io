<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruolin Yang 杨若霖</title>
  <meta name="description" content="Ruolin Yang（杨若霖）的个人主页">
  <style>
    :root { --bg:#fafafa; --fg:#1f2328; --muted:#656d76; --card:#fff; --line:#d8dee4; --accent:#0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8d96a0; --card:#161b22; --line:#30363d; --accent:#4493f8; }
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
      font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif; }
    main { max-width:640px; margin:0 auto; padding:72px 20px; }
    .photo { width:160px; height:160px; border-radius:50%; object-fit:cover; display:block; margin:0 0 20px; border:1px solid var(--line); }
    .cn { font-weight:400; color:var(--muted); font-size:1.5rem; }
    h1 { font-size:2.2rem; margin:0 0 4px; }
    .sub { color:var(--muted); margin:0 0 32px; }
    ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
    a.card { display:flex; justify-content:space-between; align-items:center; gap:12px;
      padding:14px 18px; background:var(--card); border:1px solid var(--line);
      border-radius:10px; color:var(--fg); text-decoration:none; }
    a.card:hover { border-color:var(--accent); }
    a.card small { color:var(--muted); }
    footer { margin-top:40px; color:var(--muted); font-size:.85rem; }
  </style>
</head>
<body>
  <main>
    <img class="photo" src="photo.jpg" alt="Ruolin Yang 杨若霖">
    <h1>Ruolin Yang <span class="cn">杨若霖</span></h1>
    <p class="sub">个人主页 · Personal homepage</p>
    <ul>
      <li><a class="card" target="_blank" rel="noopener" href="https://scholar.google.com/citations?user=5X0IRocAAAAJ&amp;hl=zh-CN">
        <span>Google Scholar</span><small>论文与引用</small></a></li>
    </ul>
    <footer>© Ruolin Yang</footer>
  </main>
</body>
</html>
